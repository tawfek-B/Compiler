{% extends "base.html" %}

{% block title %}Products List{% endblock %}

{% block content %}
<h1>Our Products</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    {% for product in products %}
    <div class="card">
        <img src="{{ product.image }}" alt="{{ product.name }}" style="width:100%; height:180px; object-fit:cover; border-radius:8px;">
        <h3>{{ product.name }}</h3>
        <p><strong>Price:</strong> ${{ "%.2f"|format(product.price) }}</p>
        <a href="{{ url_for('product_details', product_id=product.id) }}" style="color:#007bff;">View Details</a>
    </div>
    {% else %}
    <p>No products yet. <a href="{{ url_for('add_product') }}">Add one!</a></p>
    {% endfor %}
</div>
{% endblock %}
